<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IP Analyzer</title>

<style>
body {
    font-family: Consolas, monospace;
    background: #0f2a44;
    color: #d1d5db;
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 40px;
}

/* FLOAT ANIMATION */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

.card {
    background: #111827;
    border-radius: 6px;
    width: 300px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);

    animation: float 3s ease-in-out infinite;
    transition: transform 0.3s ease;
}

/* DIFFERENT FLOAT TIMING */
.card:nth-child(1) { animation-delay: 0s; }
.card:nth-child(2) { animation-delay: 0.5s; }
.card:nth-child(3) { animation-delay: 1s; }

/* HOVER EFFECT */
.card:hover {
    transform: scale(1.05);
}

.header {
    background: #0f766e;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    color: white;
}

.input {
    background: #1e3a5f;
    padding: 8px;
    color: #22c55e;
}

.content {
    padding: 15px;
    font-size: 14px;
}

.valid { color: #22c55e; }
.invalid { color: #ef4444; }
.highlight { color: #38bdf8; }

button {
    margin-top: 10px;
    padding: 6px 10px;
    background: #38bdf8;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- IPv4 -->
<div class="card">
    <div class="header">IPv4 Analysis</div>
    <div class="input">
        Input: <input id="ipv4Input" placeholder="192.168.1.1/24">
        <button onclick="analyzeIPv4()">Run</button>
    </div>
    <div class="content" id="ipv4Output"></div>
</div>

<!-- IPv6 -->
<div class="card">
    <div class="header">IPv6 Formatting</div>
    <div class="input">
        Input: <input id="ipv6Input" placeholder="2001:db8::1">
        <button onclick="analyzeIPv6()">Run</button>
    </div>
    <div class="content" id="ipv6Output"></div>
</div>

<!-- Error -->
<div class="card">
    <div class="header">Validation Error</div>
    <div class="input">
        Input: <input id="errorInput" placeholder="999.999.0.1">
        <button onclick="validateIP()">Run</button>
    </div>
    <div class="content" id="errorOutput"></div>
</div>

<script>
function analyzeIPv4() {
    let val = document.getElementById("ipv4Input").value;
    let out = document.getElementById("ipv4Output");

    try {
        let [ip, prefix] = val.split("/");
        let parts = ip.split(".").map(Number);

        if (parts.length !== 4 || parts.some(p => p > 255)) throw "err";

        let totalHosts = Math.pow(2, 32 - prefix);
        let network = parts[0] + "." + parts[1] + "." + parts[2] + ".0";
        let broadcast = parts[0] + "." + parts[1] + "." + parts[2] + ".255";

        out.innerHTML = `
        <div class="highlight">📡 SUBNET INFORMATION</div><br>
        Network Address: ${network}<br>
        Broadcast Address: ${broadcast}<br>
        Total Hosts: ${totalHosts}<br>
        First Host: ${parts[0]}.${parts[1]}.${parts[2]}.1<br>
        Last Host: ${parts[0]}.${parts[1]}.${parts[2]}.254
        `;
    } catch {
        out.innerHTML = `<span class="invalid">❌ INVALID INPUT</span>`;
    }
}

function analyzeIPv6() {
    let ip = document.getElementById("ipv6Input").value;
    let out = document.getElementById("ipv6Output");

    if (!ip.includes(":")) {
        out.innerHTML = `<span class="invalid">❌ INVALID IP ADDRESS</span>`;
        return;
    }

    out.innerHTML = `
    <span class="valid">✔ VALID IP ADDRESS</span><br>
    Address: ${ip}<br>
    Type: IPv6<br>
    Expanded: (simplified)<br>
    Compressed: ${ip}<br>
    Type: Unique Local (Private)
    `;
}

function validateIP() {
    let ip = document.getElementById("errorInput").value;
    let out = document.getElementById("errorOutput");

    let valid = /^(\d{1,3}\.){3}\d{1,3}$/.test(ip) &&
        ip.split(".").every(n => n >= 0 && n <= 255);

    if (!valid) {
        out.innerHTML = `
        <span class="invalid">❌ INVALID IP ADDRESS</span>
        `;
    } else {
        out.innerHTML = `<span class="valid">✔ VALID</span>`;
    }
}
</script>

</body>
</html>
